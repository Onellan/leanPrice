services:
  leanprice:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
    image: leanprice:local
    container_name: leanprice
    restart: unless-stopped
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 440000000
    memswap_limit: 440000000
    stop_grace_period: 15s
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    environment:
      LEANPRICE_ADDR: 0.0.0.0:8080
      LEANPRICE_DATA_DIR: /data
      LEANPRICE_TRUSTED_PROXIES: ${LEANPRICE_TRUSTED_PROXIES:-}
      GOMEMLIMIT: 256MiB
      GOGC: "100"
      GOMAXPROCS: "2"
    ports:
      - "${LEANPRICE_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    volumes:
      - leanprice_data:/data
    healthcheck:
      test: ["CMD", "/app/leanprice", "healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  leanprice_data:
